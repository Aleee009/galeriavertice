<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Reels • vertice.art</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="../assets/css/instagram.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
/* Reels specific */
.reels-app{
  height:100vh;
  overflow-y:scroll;
  scroll-snap-type:y mandatory;
  background:black;
}

.reel{
  height:100vh;
  position:relative;
  scroll-snap-align:start;
}

.reel video{
  width:100%;
  height:100%;
  object-fit:cover;
}

.reel-overlay{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:space-between;
  pointer-events:none;
}

.reel-info{
  position:absolute;
  bottom:80px;
  left:16px;
  color:white;
  max-width:70%;
}

.reel-info .user{
  font-weight:600;
  margin-bottom:6px;
}

.reel-info .caption{
  font-size:14px;
  color:#ddd;
}

.reel-info .audio{
  margin-top:6px;
  font-size:12px;
  color:#aaa;
}

.reel-actions{
  position:absolute;
  right:12px;
  bottom:100px;
  display:flex;
  flex-direction:column;
  gap:20px;
  color:white;
  text-align:center;
  font-size:20px;
  pointer-events:auto;
}

.reel-actions span{
  font-size:12px;
  color:#ccc;
}
</style>
</head>

<body class="reels">

<div class="reels-app">

  <!-- Reel 1 -->
  <section class="reel">
    <video src="https://cdn.coverr.co/videos/coverr-coffee-pour-7344/1080p.mp4" autoplay muted loop></video>

    <div class="reel-info">
      <div class="user">@vertice.art</div>
      <div class="caption">Nueva serie: luz y materia en equilibrio.</div>
      <div class="audio">🎵 Original audio — VÉRTICE</div>
    </div>

    <div class="reel-actions">
      <div><i class="fa-solid fa-heart"></i><span>12.4k</span></div>
      <div><i class="fa-regular fa-comment"></i><span>412</span></div>
      <div><i class="fa-regular fa-paper-plane"></i></div>
      <div><i class="fa-regular fa-bookmark"></i></div>
    </div>
  </section>

  <!-- Reel 2 -->
  <section class="reel">
    <video src="https://cdn.coverr.co/videos/coverr-working-on-a-laptop-8212/1080p.mp4" muted loop></video>

    <div class="reel-info">
      <div class="user">@vertice.art</div>
      <div class="caption">Así se construye una exposición digital.</div>
      <div class="audio">🎵 Original audio — Studio Vertice</div>
    </div>

    <div class="reel-actions">
      <div><i class="fa-solid fa-heart"></i><span>8.1k</span></div>
      <div><i class="fa-regular fa-comment"></i><span>231</span></div>
      <div><i class="fa-regular fa-paper-plane"></i></div>
      <div><i class="fa-regular fa-bookmark"></i></div>
    </div>
  </section>

  <!-- Reel 3 -->
  <section class="reel">
    <video src="https://cdn.coverr.co/videos/coverr-painting-canvas-5406/1080p.mp4" muted loop></video>

    <div class="reel-info">
      <div class="user">@vertice.art</div>
      <div class="caption">Proceso creativo de uno de nuestros artistas.</div>
      <div class="audio">🎵 Original audio — Art Studio</div>
    </div>

    <div class="reel-actions">
      <div><i class="fa-solid fa-heart"></i><span>15.9k</span></div>
      <div><i class="fa-regular fa-comment"></i><span>894</span></div>
      <div><i class="fa-regular fa-paper-plane"></i></div>
      <div><i class="fa-regular fa-bookmark"></i></div>
    </div>
  </section>

</div>

</body>
</html>
