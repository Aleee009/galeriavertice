<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <title>Artistas — Galería Vértice</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- CSS global -->
  <link rel="stylesheet" href="../assets/css/styles.css" />

  <!-- Google Fonts + Material Icons -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,200,0,0"
    rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>

<body data-page="artistas">

  <!-- HEADER se inyecta por main.js -->

  <main class="page page-artistas">

    <!-- =====================================================
         CABECERA DE SECCIÓN
    ====================================================== -->
    <section class="section-header container">
      <h1 class="section-title">Artistas</h1>

      <div class="section-tools">
        <div class="search-box">
          <span class="material-symbols-outlined">search</span>
          <input type="search" id="artistSearch" placeholder="Buscar artista" aria-label="Buscar artista" />
        </div>

        <div class="order-select-wrapper">
          <select id="artistOrder" class="order-select" aria-label="Ordenar artistas">
            <option value="az">A – Z</option>
            <option value="za">Z – A</option>
          </select>

          <span class="material-symbols-outlined select-icon">
            expand_more
          </span>
        </div>
      </div>
    </section>


    <!-- =====================================================
         FILTROS POR CATEGORÍA
    ====================================================== -->
    <section class="artist-filters container">
      <div class="filters-left" id="artistFilters">
        <!-- JS genera las pills desde categorias.json -->
      </div>

      <button class="filters-more" type="button" aria-label="Mostrar más categorías">
        Más categorías <span>›</span>
      </button>
    </section>

    <!-- =====================================================
         GRID DE ARTISTAS
    ====================================================== -->
    <section class="artists-grid container" id="artistsGrid" aria-live="polite">
      <!-- JS genera las cards de artistas -->
    </section>

  </main>

  <!-- FOOTER se inyecta por main.js -->

  <!-- JS -->
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/pages.js"></script>
  <script src="../assets/js/main.js"></script>

</body>

</html>
