<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <title>VÉRTICE — Registro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- CSS -->
  <link rel="stylesheet" href="../assets/css/styles.css" />

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Marcellus&display=swap"
    rel="stylesheet" />

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>

<body data-page="register">

  <main class="auth-layout">

    <!-- COLUMNA IMAGEN -->
    <section class="auth-image">
      <img src="../assets/img/imagen-register.jpg" alt="Galería de arte" />
    </section>

    <!-- COLUMNA FORMULARIO -->
    <section class="auth-form">

      <div class="auth-form-inner">

        <div class="auth-logo">
          <img src="../assets/icons/logo_vertice.svg" alt="Vértice" />
        </div>

        <!-- Títulos -->
        <h1>Galería Vértice</h1>
        <p class="auth-subtitle">Regístrate con nosotros</p>

        <!-- FORMULARIO -->
        <form class="form-auth">

          <div class="form-group">
            <label for="nombre">Nombre completo</label>
            <input type="text" id="nombre" required />
          </div>

          <div class="form-group">
            <label for="email">Correo</label>
            <input type="email" id="email" required />
          </div>

          <div class="form-group form-select">
            <label for="tipo">Tipo de Usuario</label>
            <select id="tipo" required>
              <option value="" disabled selected hidden>Selecciona una opción</option>
              <option value="usuario">Usuario</option>
              <option value="artista">Artista</option>
            </select>
          </div>

          <div class="form-group form-password">
            <label for="password">Contraseña</label>

            <div class="password-field">
              <input type="password" id="password" required />
              <button type="button" class="toggle-password" aria-label="Mostrar contraseña">
                <i class="fa-regular fa-eye"></i>
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn-primary">
            Registrarse
          </button>

        </form>

        <!-- Footer form -->
        <div class="auth-footer">
          <span>¿Ya tienes cuenta?</span>
          <a href="login.html" class="ui-text-action">Inicia sesión</a>
        </div>

        <small class="auth-copy">© 2025 Galería Vértice</small>

      </div>
    </section>

  </main>

  <!-- JS -->
  <script src="../assets/js/main.js"></script>

</body>

</html>
