<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>vertice.art • Publicación</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="../assets/css/instagram.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="../assets/js/instagram.js" defer></script>
</head>

<body class="ig post-view">

<!-- Back -->
<a href="instagram.html" class="back-btn" aria-label="Volver">
  <span class="back-bg"></span>
  <i class="fa-solid fa-arrow-left"></i>
</a>

<div class="post-container">

  <!-- Image -->
  <div class="post-media">
    <img src="https://picsum.photos/900?1" alt="Publicación">
  </div>

  <!-- Right side -->
  <aside class="post-side">

    <!-- Header -->
    <header class="post-header">
      <div class="post-user">
        <div class="avatar small"></div>
        <strong>vertice.art</strong>
      </div>
      <i class="fa-solid fa-ellipsis"></i>
    </header>

    <!-- Caption + comments -->
    <section class="post-comments">

      <div class="comment">
        <strong>vertice.art</strong>
        Explorando el contraste entre espacio y materia.
      </div>

      <div class="comment">
        <strong>anna</strong> La composición es brutal 🔥
      </div>
      <div class="comment">
        <strong>mark</strong> Me encanta el tratamiento de la luz
      </div>
      <div class="comment">
        <strong>lucia</strong> Esto parece una galería
      </div>
      <div class="comment">
        <strong>daniel</strong> ¿Es una serie nueva?
      </div>

    </section>

    <!-- Actions -->
    <section class="post-actions">
      <div class="action-row">
        <div class="left">
          <i class="fa-regular fa-heart like"></i>
          <i class="fa-regular fa-comment"></i>
          <i class="fa-regular fa-paper-plane"></i>
        </div>
        <div class="right">
          <i class="fa-regular fa-bookmark save"></i>
        </div>
      </div>

      <div class="likes-count">1,245 likes</div>
      <div class="post-date">Hace 3 días</div>
    </section>

    <!-- Add comment -->
    <footer class="post-add-comment">
      <i class="fa-regular fa-face-smile"></i>
      <input type="text" placeholder="Añade un comentario…">
      <button>Publicar</button>
    </footer>

  </aside>

</div>

</body>
</html>
