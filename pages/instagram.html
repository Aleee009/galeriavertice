<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Instagram — vertice.art</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../assets/css/instagram.css">
<script src="../assets/js/instagram.js" defer></script>
</head>

<body class="ig-web">

<div class="ig-app">

  <!-- =========================
       SIDEBAR
  ========================== -->
  <aside class="ig-sidebar">

    <div class="ig-logo">Instagram</div>

    <nav class="ig-menu">

      <a>
        <svg class="ig-icon" viewBox="0 0 24 24">
          <path d="M3 12l9-9 9 9v8a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"
                fill="none" stroke="currentColor" stroke-width="1.8"/>
        </svg>
        Inicio
      </a>

      <a>
        <svg class="ig-icon" viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="4"
                fill="none" stroke="currentColor" stroke-width="1.8"/>
          <path d="M8 8l8 8M16 8l-8 8"
                stroke="currentColor" stroke-width="1.8"/>
        </svg>
        Reels
      </a>

      <a>
        <svg class="ig-icon" viewBox="0 0 24 24">
          <path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"
                fill="none" stroke="currentColor" stroke-width="1.8"/>
        </svg>
        Mensajes
      </a>

      <a>
        <svg class="ig-icon" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="7"
                  fill="none" stroke="currentColor" stroke-width="1.8"/>
          <line x1="16.5" y1="16.5" x2="21" y2="21"
                stroke="currentColor" stroke-width="1.8"/>
        </svg>
        Búsqueda
      </a>

      <a>
        <svg class="ig-icon" viewBox="0 0 24 24">
          <polygon points="12 2 15 8.5 22 9.3 17 14.1 18.5 21 12 17.5 5.5 21 7 14.1 2 9.3 9 8.5"
                   fill="none" stroke="currentColor" stroke-width="1.8"/>
        </svg>
        Explorar
      </a>

      <a>
        <svg class="ig-icon" viewBox="0 0 24 24">
          <path d="M16.5 3c-1.74 0-3.41 1-4.5 2.09C10.91 4 9.24 3 7.5 3
                   4.42 3 2 5.42 2 8.5c0 5.25 10 12.5 10 12.5s10-7.25
                   10-12.5C22 5.42 19.58 3 16.5 3z"
                fill="none" stroke="currentColor" stroke-width="1.8"/>
        </svg>
        Notificaciones
      </a>

      <a>
        <svg class="ig-icon" viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="4"
                fill="none" stroke="currentColor" stroke-width="1.8"/>
          <path d="M12 7v10M7 12h10"
                stroke="currentColor" stroke-width="1.8"/>
        </svg>
        Crear
      </a>

      <a class="active">
        <div class="avatar small"></div>
        Perfil
      </a>

    </nav>

    <div class="ig-more">☰ Más</div>
  </aside>

  <!-- =========================
       MAIN CONTENT
  ========================== -->
  <main class="ig-content">

    <!-- ESTA COLUMNA ES LA CLAVE -->
    <div class="ig-column">

      <section class="profile">

        <div class="profile-main">
          <div class="avatar"></div>

          <div>
            <div class="profile-actions">
              <button class="btn btn-follow following" id="followBtn">
                Siguiendo
                <svg class="ig-icon ig-caret" viewBox="0 0 24 24">
                  <path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2"/>
                </svg>
              </button>

              <button class="btn btn-message">Enviar mensaje</button>
              <button class="btn btn-more">👤+</button>
            </div>

            <div class="stats">
              <div><strong>132</strong><span> publicaciones</span></div>
              <div><strong>8.2k</strong><span> seguidores</span></div>
              <div><strong>402</strong><span> seguidos</span></div>
            </div>

            <div class="bio">
              <strong>VÉRTICE</strong><br>
              Arte contemporáneo desde otro ángulo.<br>
              Curaduría, artistas y piezas únicas.<br>
              <a href="#">vertice.art</a>
            </div>
          </div>

        </div>

      </section>

      <section class="stories">
        <div class="story"><div class="story-ring"><div class="story-avatar"></div></div><span>01/24</span></div>
        <div class="story"><div class="story-ring"><div class="story-avatar"></div></div><span>12/23</span></div>
        <div class="story"><div class="story-ring"><div class="story-avatar"></div></div><span>11/23</span></div>
        <div class="story"><div class="story-ring"><div class="story-avatar"></div></div><span>10/23</span></div>
      </section>

      <div class="ig-divider"></div>

      <main class="grid">
        <a href="instagram-post.html" class="post"><img src="https://picsum.photos/600?1"></a>
        <a href="instagram-post.html" class="post"><img src="https://picsum.photos/600?2"></a>
        <a href="instagram-post.html" class="post"><img src="https://picsum.photos/600?3"></a>
        <a href="instagram-post.html" class="post"><img src="https://picsum.photos/600?4"></a>
        <a href="instagram-post.html" class="post"><img src="https://picsum.photos/600?5"></a>
        <a href="instagram-post.html" class="post"><img src="https://picsum.photos/600?6"></a>
      </main>

    </div>
  </main>

</div>

</body>
</html>
