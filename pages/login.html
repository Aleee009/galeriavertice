<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <title>Iniciar sesión — Galería Vértice</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- CSS -->
  <link rel="stylesheet" href="../assets/css/styles.css" />
</head>

<body>

  <main class="auth-layout">

    <!-- COLUMNA FORMULARIO -->
    <section class="auth-form">
      <div class="auth-form-inner">

        <!-- Logo -->
        <div class="auth-logo">
          <img src="assets/icons/logo_vertice.svg" alt="Galería Vértice">
        </div>

        <!-- Título -->
        <h1>Galería Vértice</h1>
        <p class="auth-subtitle">Accede a tu cuenta</p>

        <!-- FORMULARIO -->
        <form class="form-auth">

          <div class="form-group">
            <label for="email">Correo electrónico</label>
            <input type="email" id="email" name="email" required />
          </div>

          <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" required />
          </div>

          <!-- Opciones -->
          <div class="auth-options">
            <label class="remember-me">
              <input type="checkbox" />
              <span>Recordarme</span>
            </label>

            <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
          </div>

          <!-- Botón -->
          <button type="submit" class="btn btn-primary">
            Iniciar sesión
          </button>

        </form>

        <!-- Footer auth -->
        <div class="auth-footer">
          <p>¿No tienes cuenta? <a href="register.html">Regístrate</a></p>
          <span class="auth-copy">© 2026 Galería Vértice</span>
        </div>

      </div>
    </section>

    <!-- COLUMNA IMAGEN -->
    <section class="auth-image">
      <!-- Aquí irá la imagen artística -->
    </section>

  </main>

</body>

</html>
