<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <title>Iniciar sesión — Galería Vértice</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Font Awesome (OBLIGATORIO PARA EL ICONO DEL OJO) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <!-- CSS -->
  <link rel="stylesheet" href="../assets/css/styles.css" />
</head>

<body data-page="login">
  <main class="auth-layout">

    <!-- COLUMNA FORMULARIO -->
    <section class="auth-form">
      <div class="auth-form-inner">

        <!-- Logo -->
        <div class="auth-logo">
          <img src="../assets/icons/logo_vertice.svg" alt="Galería Vértice">
        </div>

        <!-- Título -->
        <h1>Galería Vértice</h1>
        <p class="auth-subtitle">Accede a tu cuenta</p>

        <!-- FORMULARIO -->
        <form class="form-auth">

          <!-- Email -->
          <div class="form-group">
            <label for="email">Correo electrónico</label>
            <input type="email" id="email" name="email" required />
          </div>

          <!-- Password con ojo -->
          <div class="form-group form-password">
            <label for="password">Contraseña</label>

            <input type="password" id="password" name="password" required />

            <button type="button" class="toggle-password" aria-label="Mostrar contraseña">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>

          <!-- Opciones -->
          <div class="auth-options">
            <label class="remember-me">
              <input type="checkbox">
              <span>Recordarme</span>
            </label>

            <a href="#" class="forgot-password">
              ¿Olvidaste tu contraseña?
            </a>
          </div>

          <!-- Botón -->
          <button type="submit" class="btn">
            Iniciar sesión
          </button>

        </form>

        <!-- Footer auth -->
        <div class="auth-footer">
          <p>
            ¿No tienes cuenta?
            <a href="#" onclick="goToAuth('register.html')">Regístrate</a>

          </p>
          <span class="auth-copy">© 2026 Galería Vértice</span>
        </div>

      </div>
    </section>

    <!-- COLUMNA IMAGEN -->
    <section class="auth-image">
      <img src="../assets/img/imagen_login.jpg" alt="Galería de arte" />
    </section>

  </main>

  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/auth.js"></script>


</body>

</html>
